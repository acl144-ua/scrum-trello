<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
    <style>
      div#settings {
        padding: 15px;
      }
      div.field,
      div.sprint {
        margin-bottom: 8px;
      }
      div.field label {
        display: inline-block;
        width: 260px;
      }
      div.field input,
      div.sprint input {
        display: inline-block;
        width: 110px;
        margin-right: 4px;
      }
      div.sprint span.name {
        display: inline-block;
        width: 70px;
        font-weight: bold;
      }
      div.sprint span.cap {
        margin-left: 8px;
        color: #6EA952;
        font-weight: bold;
      }
      p.error {
        color: #EB5A46;
        margin: 8px 0 0 0;
      }
      p.ok {
        color: #6EA952;
        margin: 8px 0 0 0;
      }
      div.actions,
      div.import {
        margin-top: 12px;
      }
      div.import {
        padding-top: 8px;
        border-top: 1px solid #dfe1e6;
      }
    </style>
  </head>
  <body>

    <div id="settings" v-if="config">

      <h3>Configurar tablero</h3>

      <div class="field">
        <label>¿Cuántas personas sois en el equipo?</label>
        <input type="number" min="1" v-model.number="config.people">
      </div>
      <div class="field">
        <label>¿A cuántas horas equivale 1 story point?</label>
        <input type="number" min="1" v-model.number="config.hours">
      </div>
      <div class="field">
        <label>Horas por persona y semana</label>
        <input type="number" min="1" v-model.number="config.hoursPerPersonWeek">
      </div>

      <h4>Sprints (fechas DD/MM/AAAA)</h4>
      <div class="sprint" v-for="(sprint, index) in config.sprints" :key="index">
        <span class="name">Sprint {{ index + 1 }}</span>
        <input type="text" placeholder="DD/MM/AAAA" v-model="sprint.from">
        <input type="text" placeholder="DD/MM/AAAA" v-model="sprint.to">
        <span class="cap" v-if="capacity(sprint) !== null">{{ capacity(sprint) | fix }} SP</span>
        <button class="mod-danger" @click="removeSprint(index)" v-if="config.sprints.length > 1">Quitar</button>
      </div>
      <button @click="addSprint()">Añadir sprint</button>

      <p class="error" v-if="error">{{ error }}</p>
      <p class="ok" v-if="saved">Configuración guardada</p>

      <div class="actions">
        <button class="mod-primary" @click="save()">Guardar</button>
        <button @click="restore()">Valores por defecto</button>
      </div>

      <div class="import" v-if="importData">
        <p>Datos del Power-Up anterior: {{ importData.cards.length }} tarjetas (tipo, puntos, sprint y fecha de finalización).</p>
        <button @click="importOld()">Importar datos del Scrum anterior</button>
        <p class="ok" v-if="importMessage">{{ importMessage }}</p>
      </div>

    </div>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.5.16/dist/vue.min.js"></script>
    <script src="./common.js?cache=4"></script>
    <script src="./import-data.js?cache=4"></script>
    <script>

/* global TrelloPowerUp */
var t = TrelloPowerUp.iframe();

new Vue({
  el: '#settings',
  data () {
    return {
      config: null,
      error: '',
      saved: false,
      importData: typeof IMPORT_DATA !== 'undefined' ? IMPORT_DATA : null,
      importMessage: '',
    }
  },
  async created () {
    this.config = JSON.parse(JSON.stringify(await loadConfig(t)));
  },
  methods: {
    capacity (sprint) {
      const from = moment(sprint.from, DATE_FORMAT, true);
      const to = moment(sprint.to, DATE_FORMAT, true);
      if (!from.isValid() || !to.isValid() || !this.config.hours) {
        return null;
      }
      return sprintCapacitySP(sprint, this.config);
    },
    addSprint () {
      const last = this.config.sprints[this.config.sprints.length - 1];
      const from = moment(last.to, DATE_FORMAT, true);
      const start = from.isValid() ? from : moment();
      this.config.sprints.push({
        from: start.format(DATE_FORMAT),
        to: start.clone().add(4, 'weeks').format(DATE_FORMAT),
      });
    },
    removeSprint (index) {
      this.config.sprints.splice(index, 1);
    },
    validate () {
      const c = this.config;
      if (!(c.people > 0 && c.hours > 0 && c.hoursPerPersonWeek > 0)) {
        return 'Personas, horas por story point y horas por persona y semana tienen que ser mayores que 0';
      }
      for (const [index, sprint] of c.sprints.entries()) {
        const from = moment(sprint.from, DATE_FORMAT, true);
        const to = moment(sprint.to, DATE_FORMAT, true);
        if (!from.isValid() || !to.isValid()) {
          return 'Las fechas del Sprint ' + (index + 1) + ' no son válidas (usa DD/MM/AAAA)';
        }
        if (!to.isAfter(from)) {
          return 'En el Sprint ' + (index + 1) + ' la fecha de fin tiene que ser posterior a la de inicio';
        }
      }
      return '';
    },
    async save () {
      this.saved = false;
      this.error = this.validate();
      if (this.error) {
        return;
      }
      await t.set('board', 'shared', {
        people: this.config.people,
        hours: this.config.hours,
        hoursPerPersonWeek: this.config.hoursPerPersonWeek,
        sprints: this.config.sprints.map(s => ({ from: s.from, to: s.to })),
      });
      this.saved = true;
    },
    async restore () {
      await t.remove('board', 'shared', ['people', 'hours', 'hoursPerPersonWeek', 'sprints']);
      this.config = JSON.parse(JSON.stringify(await loadConfig(t)));
      this.error = '';
      this.saved = true;
    },
    async importOld () {
      this.importMessage = 'Importando...';
      let done = 0;
      for (const card of this.importData.cards) {
        const data = {};
        for (const key of ['type', 'sp', 'sprint', 'date', 'spr']) {
          if (card[key] !== undefined && card[key] !== '') {
            data[key] = card[key];
          }
        }
        await t.set(card.id, 'shared', data);
        done++;
      }
      this.importMessage = 'Importadas ' + done + ' tarjetas';
    },
  },
  filters: {
    fix: function (value) {
      return value % 1 !== 0 ? value.toFixed(1) : Number(value);
    }
  }
});
    </script>

  </body>
</html>
